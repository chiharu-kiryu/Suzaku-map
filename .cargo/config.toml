[alias]
panel-macos = "run --features gpu --bin panel"
linux-register = "run --bin suzaku_tool -- linux-register"
linux-register-ime = "run --bin suzaku_tool -- linux-register"
panel-app-macos = "run --features gpu --bin macos_bundle -- panel build"
open-panel-app-macos = "run --features gpu --bin macos_bundle -- panel open"
install-panel-app-macos = "run --features gpu --bin macos_bundle -- panel install"
install-open-panel-app-macos = "run --features gpu --bin macos_bundle -- panel install-open"
ime-app-macos = "run --features gpu --bin macos_bundle -- ime build"
open-ime-app-macos = "run --features gpu --bin macos_bundle -- ime open"
install-ime-app-macos = "run --features gpu --bin macos_bundle -- ime install"
install-open-ime-app-macos = "run --features gpu --bin macos_bundle -- ime install-open"
enable-ime-app-macos = "run --features gpu --bin macos_bundle -- ime enable"
install-enable-ime-app-macos = "run --features gpu --bin macos_bundle -- ime install-enable"
test-gpu = "test --features gpu"
test-gpu-smoke = "test --features gpu -- --nocapture"
test-gpu-smoke-llm = "test --features gpu -- --nocapture"
ime-host = "run --features gpu --bin ime_host"
android-ime-host = "run --features gpu --bin android_ime_host"
android-doctor = "run --features gpu --bin android_doctor"
android-env = "run --bin suzaku_tool -- android env"
android-build-native = "run --features gpu --bin suzaku_tool -- android-build-native"
android-install-debug = "run --bin suzaku_tool -- android-install-debug"
android-enable-ime = "run --bin suzaku_tool -- android-enable-ime"
build-macos-app = "run --features gpu --bin suzaku_tool -- build-macos-app"
open-macos-app = "run --bin suzaku_tool -- open-macos-app"

[package]
name = "suzaku-map"
version = "0.8.5"
edition = "2024"
license = "MIT"
description = "TDD-driven XR and tablet IME engine prototype in Rust"

# Match the disk-efficient CI profile for everyday local builds. Full debugger
# information can be enabled explicitly without changing release artifacts.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:fontdue", "dep:pollster", "dep:winit", "dep:ksni", "dep:x11rb"]
linux-ibus = ["gpu"]

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"], optional = true }
fontdue = { version = "0.9.4", optional = true }
jni = "0.21.1"
pollster = { version = "0.4.0", optional = true }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
unicode-width = "0.2.2"
wgpu = { version = "27.0.1", optional = true, default-features = false, features = ["dx12", "gles", "vulkan", "wgsl", "metal"] }
winit = { version = "0.30.12", optional = true, default-features = false, features = ["android-native-activity", "rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
ksni = { version = "0.3.6", optional = true, features = ["blocking"] }
x11rb = { version = "0.13.2", optional = true }

# Same-event X11 button coordinates; no pointer polling or extra input hook.
# See the provenance, bounded patch and removal conditions in this notice.
[patch.crates-io]
winit = { path = "vendor/winit" }

[lib]
name = "suzaku_map"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
cc = "1.1.31"

[dev-dependencies]
rcgen = "0.13.2"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }

[[bin]]
name = "panel"
path = "src/bin/panel.rs"
required-features = ["gpu"]

[[bin]]
name = "macos_bundle"
path = "src/bin/macos_bundle.rs"
required-features = ["gpu"]

[[bin]]
name = "macos_ime_host"
path = "src/bin/macos_ime_host.rs"

[[bin]]
name = "ime_host"
path = "src/bin/ime_host.rs"
required-features = ["gpu"]

[[bin]]
name = "linux_ime_host"
path = "src/bin/linux_ime_host.rs"
required-features = ["linux-ibus"]

[[bin]]
name = "linux_ime_probe"
path = "src/bin/linux_ime_probe.rs"
required-features = ["linux-ibus"]

[[bin]]
name = "android_ime_host"
path = "src/bin/android_ime_host.rs"
required-features = ["gpu"]

[[bin]]
name = "suzaku_tool"
path = "src/bin/suzaku_tool.rs"

[[bin]]
name = "android_doctor"
path = "src/bin/android_doctor.rs"
required-features = ["gpu"]

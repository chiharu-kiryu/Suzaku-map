[package]
name = "suzaku-map"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "TDD-driven XR and tablet IME engine prototype in Rust"

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:winit", "dep:fontdue"]

[dependencies]
bytemuck = { version = "1.24.0", features = ["derive"], optional = true }
fontdue = { version = "0.9.3", optional = true }
jni = "0.21.1"
pollster = { version = "0.4.0", optional = true }
wgpu = { version = "27.0.1", optional = true }
winit = { version = "0.30.12", optional = true, features = ["android-native-activity"] }

[lib]
name = "suzaku_map"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
cc = "1.1.31"

[[bin]]
name = "panel"
path = "src/bin/panel.rs"
required-features = ["gpu"]

[[bin]]
name = "macos_bundle"
path = "src/bin/macos_bundle.rs"
required-features = ["gpu"]

[[bin]]
name = "macos_ime_host"
path = "src/bin/macos_ime_host.rs"

[[bin]]
name = "ime_host"
path = "src/bin/ime_host.rs"
required-features = ["gpu"]

[[bin]]
name = "android_ime_host"
path = "src/bin/android_ime_host.rs"
required-features = ["gpu"]

[[bin]]
name = "suzaku_tool"
path = "src/bin/suzaku_tool.rs"

[[bin]]
name = "android_doctor"
path = "src/bin/android_doctor.rs"
required-features = ["gpu"]
